<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="db_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2035"/>
      <stop offset="100%" stop-color="#0E1220"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#db_grad)"/>
  <rect x="30" y="30" width="540" height="390" rx="14" fill="#121626" stroke="#232C47" stroke-width="1.5"/>
  <text x="50" y="70" fill="#38BDF8" font-family="sans-serif" font-size="16" font-weight="bold">Relational Schema &amp; ORM Models</text>
  <!-- Table representations -->
  <rect x="50" y="100" width="240" height="140" rx="8" fill="#1C233D" stroke="#33416B" stroke-width="1"/>
  <rect x="50" y="100" width="240" height="30" rx="8" fill="#29355B"/>
  <text x="65" y="122" fill="#D7E2EA" font-family="monospace" font-size="13">Users (Table)</text>
  <text x="65" y="155" fill="#94A3B8" font-family="monospace" font-size="11">id: UUID PRIMARY KEY</text>
  <text x="65" y="180" fill="#94A3B8" font-family="monospace" font-size="11">email: VARCHAR UNIQUE</text>
  <text x="65" y="205" fill="#94A3B8" font-family="monospace" font-size="11">password_hash: VARCHAR</text>

  <rect x="320" y="100" width="240" height="140" rx="8" fill="#1C233D" stroke="#33416B" stroke-width="1"/>
  <rect x="320" y="100" width="240" height="30" rx="8" fill="#29355B"/>
  <text x="335" y="122" fill="#D7E2EA" font-family="monospace" font-size="13">Sessions (Table)</text>
  <text x="335" y="155" fill="#94A3B8" font-family="monospace" font-size="11">id: UUID PRIMARY KEY</text>
  <text x="335" y="180" fill="#94A3B8" font-family="monospace" font-size="11">user_id: UUID FK</text>
  <text x="335" y="205" fill="#94A3B8" font-family="monospace" font-size="11">expires_at: TIMESTAMP</text>
  <!-- Query diagram -->
  <rect x="50" y="260" width="510" height="130" rx="8" fill="#171D33"/>
  <text x="70" y="300" fill="#10B981" font-family="monospace" font-size="13">SELECT users.id, profiles.display_name</text>
  <text x="70" y="330" fill="#10B981" font-family="monospace" font-size="13">FROM users JOIN profiles ON users.id = profiles.user_id;</text>
  <text x="70" y="360" fill="#64748B" font-family="monospace" font-size="12">// Query optimized with composite indexes</text>
</svg>
